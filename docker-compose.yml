services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: catholic-rag-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catholic_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catholic_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
